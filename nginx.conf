# Ejemplo de configuración para gonginx
http {
    upstream backend {
        server 127.0.0.1:9001;
        server 127.0.0.1:9002 weight=2;
    }

    server {
        listen 8080;
        server_name localhost;
        root html;
        index index.html;

        add_header X-Powered-By gonginx;

        location / {
            try_files $uri $uri/ =404;
        }

        # Proxy con balanceo round-robin; /api/x -> backend /x
        location /api/ {
            proxy_pass http://backend/;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /health {
            return 200 "ok\n";
        }

        location ~* \.(png|jpg|css|js)$ {
            add_header Cache-Control "public, max-age=3600";
        }

        location /old {
            return 301 /;
        }
    }
}

# Proxy de capa 4 (TCP/UDP) hacia servidores Linux
stream {
    upstream ssh_pool {
        server 192.168.1.38:22;
        # server unix:/var/run/otro.sock;   # también sockets Unix
    }

    server {                      # TCP: ssh -p 2222 localhost
        listen 2222;
        proxy_pass ssh_pool;
        proxy_connect_timeout 5s;
        proxy_timeout 10m;
    }

    server {                      # UDP (ej. DNS)
        listen 5454 udp;
        proxy_pass 8.8.8.8:53;
        proxy_timeout 20s;
    }
}

# Socket Unix en HTTP (dentro de un location):
#   proxy_pass http://unix:/var/run/app.sock:/;
